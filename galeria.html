<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | Refúgio das Palmeiras</title>
    <link rel="stylesheet" href="CSS/galeria.css">
</head>
<body>

    <header class="header">

        <div class="logo">
            <img src="img/logo.png" alt="Refúgio das Palmeiras">
        </div>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="index.html#sobre">Sobre</a>
            <a href="galeria.html" class="ativo">Galeria</a>
            <a href="acomodacoes.html">Acomodações</a>>
            <a href="index.html#contato">Contato</a>
        </nav>
    </header>

    <main>
        <section class="galeria">
            <div class="introducao">
                <span class="subtitulo">DESCUBRA CADA DETALHE</span>
                <h1>Nossa Galeria</h1>
                <p>
                    Explore os ambientes do Refúgio das Palmeiras
                    e descubra o cenário perfeito para sua próxima estadia.
                </p>
            </div>

            <div class="filtros">
                <a href="#todas">Todas</a>
                <a href="#acomodacoes">Acomodações</a>
                <a href="#lazer">Lazer</a>
                <a href="#gastronomia">Gastronomia</a>
                <a href="#natureza">Natureza</a>
            </div>

            <div class="grid-galeria" id="todas">

                <figure class="foto foto-destaque" id="acomodacoes">
                    <img src="img/hotel8.jpg" alt="Quarto do hotel">
                    <figcaption>
                        <span>Acomodações</span>
                        <h2>Conforto em cada detalhe</h2>
                    </figcaption>
                </figure>

                <figure class="foto" id="lazer">
                    <img src="img/hotel7.jpg" alt="Piscina do hotel">
                    <figcaption>
                        <span>Lazer</span>
                        <h2>Momentos de tranquilidade</h2>
                    </figcaption>
                </figure>

                <figure class="foto">
                    <img src="img/hotel9.jpg" alt="Jardim do hotel">
                    <figcaption>
                        <span>Natureza</span>
                        <h2>Um refúgio verde</h2>
                    </figcaption>
                </figure>

                <figure class="foto" id="gastronomia">
                    <img src="img/hotel10.jpg" alt="Restaurante do hotel">
                    <figcaption>
                        <span>Gastronomia</span>
                        <h2>Sabores especiais</h2>
                    </figcaption>
                </figure>

                <figure class="foto">
                    <img src="img/hotel12.jpg" alt="Fachada do hotel">
                    <figcaption>
                        <span>O hotel</span>
                        <h2>Bem-vindo ao nosso refúgio</h2>
                    </figcaption>
                </figure>

                <figure class="foto" id="natureza">
                    <img src="img/hotel11.jpg" alt="Área externa do hotel">
                    <figcaption>
                        <span>Natureza</span>
                        <h2>Conexão com a natureza</h2>
                    </figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Refúgio das Palmeiras.</p>
    </footer>

</body>
</html>
